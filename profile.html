<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Store | Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>
<body>

<header>
    <div onclick="location.href='index.html'" style="cursor: pointer;"><i class="fas fa-arrow-left"></i></div>
    <div style="font-family: 'Orbitron'; color: var(--primary);">MY ACCOUNT</div>
    <div onclick="logout()"><i class="fas fa-sign-out-alt"></i></div>
</header>

<main style="padding: 20px; text-align: center;">
    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" style="width: 100px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px;">
    <h2 id="display-name">Soldier</h2>
    <p id="display-phone" style="color: #94a3b8;">+91 0000000000</p>

    <div style="display: flex; gap: 15px; margin-top: 25px;">
        <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid var(--primary);">
            <p style="font-size: 0.8rem; color: #94a3b8;">Total Coins</p>
            <h3 style="color: var(--secondary);"><i class="fas fa-coins"></i> <span id="prof-coins">0</span></h3>
        </div>
        <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid var(--primary);">
            <p style="font-size: 0.8rem; color: #94a3b8;">Status</p>
            <h3 style="color: var(--primary);">ACTIVE</h3>
        </div>
    </div>

    <button class="btn-main" onclick="location.href='redeem.html'" style="width: 100%; margin-top: 30px;">GO TO REDEEM PAGE</button>
</main>

<script>
    window.onload = function() {
        document.getElementById('display-name').innerText = localStorage.getItem('ff_username') || "Soldier";
        document.getElementById('display-phone').innerText = localStorage.getItem('ff_userphone') || "No Phone";
        document.getElementById('prof-coins').innerText = localStorage.getItem('user_coins') || 0;
    }

    function logout() {
        if(confirm("லாக் அவுட் பண்ணலாமா?")) {
            localStorage.clear();
            location.href = 'index.html';
        }
    }
</script>

</body>
</html>
