<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Store | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">

<div style="background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid var(--primary); width: 90%; max-width: 400px; text-align: center;">
    
    <h2 style="color: var(--primary); font-family: 'Orbitron'; margin-bottom: 20px;">USER LOGIN</h2>

    <input type="text" id="uName" placeholder="Enter Name"
    style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; background: #111; border: 1px solid #333; color: white;">

    <input type="tel" id="uPhone" placeholder="WhatsApp Number"
    style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; background: #111; border: 1px solid #333; color: white;">

    <button class="btn-main" onclick="saveLogin()" style="width: 100%;">START TRADING</button>

</div>

<!-- ✅ Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCAilX0GQnN127N1SxCJ861qMxAO0svNUQ",
  authDomain: "ff-id-store-dab0f.firebaseapp.com",
  projectId: "ff-id-store-dab0f",
  storageBucket: "ff-id-store-dab0f.firebasestorage.app",
  messagingSenderId: "655049193530",
  appId: "1:655049193530:web:978aaf75e10dd26bb8dd03",
  databaseURL: "https://ff-id-store-dab0f-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 LOGIN FUNCTION
function saveLogin() {
    const name = document.getElementById('uName').value;
    const phone = document.getElementById('uPhone').value;

    if(!name || !phone){
        alert("டீடைல்ஸ் குடுங்க!");
        return;
    }

    // ✅ Save locally
    localStorage.setItem('ff_username', name);
    localStorage.setItem('ff_userphone', phone);

    // 🔥 Create user in Firebase (if not exists)
    db.ref('users/' + phone).once('value').then(snapshot => {

        if(!snapshot.exists()){
            db.ref('users/' + phone).set({
                name: name,
                coins: 0
            });
        }

        alert("Login Success 🔥\nYour ID: " + phone);

        // ✅ REDIRECT (important)
        window.location.href = "./index.html";

    }).catch(err => {
        alert("Error: " + err);
    });
}
</script>

</body>
</html>
